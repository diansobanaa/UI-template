openapi: 3.0.3
info:
  title: AgroTech ESP32 Local API
  version: "1.0.0"
  description: Canonical local REST contract for Single HTML Vite UI ↔ ESP32-S3.
servers:
  - url: http://esp32.local
    description: Example local device hostname
tags:
  - name: Device
  - name: Configuration
  - name: Clock
  - name: Commands
  - name: CropCycle
  - name: Telemetry
  - name: Events
  - name: Calibration
  - name: LocalSetup
  - name: Export

paths:
  /api/v1/health:
    get:
      tags: [Device]
      operationId: getHealth
      responses:
        "200":
          description: Health snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/v1/device/bind:
    post:
      tags: [Device]
      operationId: bindDeviceToComplex
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceBindRequest"
      responses:
        "200":
          description: Binding persisted on the controller
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceBindResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/device/retire:
    post:
      tags: [Device]
      operationId: retireDeviceFromComplex
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceRetireRequest"
      responses:
        "200":
          description: Controller unbound and wiped to clean factory network state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceRetireResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/status:
    get:
      tags: [Device]
      operationId: getStatus
      responses:
        "200":
          description: Full device snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"

  /api/v1/inventory:
    get:
      tags: [Device]
      operationId: getInventory
      responses:
        "200":
          description: Hardware inventory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryResponse"

  /api/v1/capabilities:
    get:
      tags: [Device]
      operationId: getCapabilities
      responses:
        "200":
          description: Firmware capabilities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapabilitiesResponse"

  /api/v1/context:
    get:
      tags: [Device]
      operationId: getContext
      responses:
        "200":
          description: Device-bound operational context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContextResponse"

  /api/v1/topology-pool:
    get:
      tags: [Topology]
      summary: Return replicated System Topology Pool
      description: Returns the persistent minimal topology registry known by this controller
      operationId: getTopologyPool
      responses:
        "200":
          description: Replicated System Topology Pool
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemTopologyPoolResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/topology-pool/meta:
    get:
      tags: [Topology]
      summary: Return Topology Pool metadata
      description: Returns lightweight metadata for quick revision/hash compatibility checks
      operationId: getTopologyPoolMeta
      responses:
        "200":
          description: Topology Pool metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopologyPoolMetaResponse"

  /api/v1/topology-pool/sync:
    post:
      tags: [Topology]
      summary: Synchronize topology pool with peer controller
      description: Reconciles peer topology pool state, detecting conflicts and tombstones
      operationId: syncTopologyPool
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [schemaId, schemaVersion, contractHash, poolRevision]
      responses:
        "200":
          description: Topology pool converged
        "409":
          $ref: "#/components/responses/ConflictError"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/topology-pool/mutate:
    post:
      tags: [Topology]
      summary: Apply topology mutation
      description: Ownership-aware mutation to create, update or delete a Complex or Greenhouse
      operationId: mutateTopologyPool
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TopologyMutationRequest"
      responses:
        "200":
          description: Mutation applied or already applied
        "409":
          $ref: "#/components/responses/ConflictError"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/clock:
    get:
      tags: [Clock]
      operationId: getClock
      responses:
        "200":
          description: Current device clock
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClockResponse"

  /api/v1/clock-sync:
    post:
      tags: [Clock]
      operationId: syncClock
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClockSyncRequest"
      responses:
        "200":
          description: Clock synchronized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClockResponse"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/configuration:
    get:
      tags: [Configuration]
      operationId: getConfiguration
      responses:
        "200":
          description: Current configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigurationResponse"
    put:
      tags: [Configuration]
      operationId: applyConfiguration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplyConfigurationRequest"
      responses:
        "200":
          description: Configuration applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigurationResponse"
        "409":
          $ref: "#/components/responses/ConflictError"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/configuration/deployment:
    get:
      tags: [Configuration]
      operationId: getConfigurationDeployment
      responses:
        "200":
          description: Configuration deployment state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigurationDeploymentResponse"

  /api/v1/configuration/deploy:
    post:
      tags: [Configuration]
      operationId: deployConfiguration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplyConfigurationRequest"
      responses:
        "200":
          description: Configuration staged, validated and atomically activated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigurationResponse"
        "409":
          $ref: "#/components/responses/ConflictError"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          description: Deployment commit failure; previous configuration remains authoritative

  /api/v1/configuration/rollback:
    post:
      tags: [Configuration]
      operationId: rollbackConfiguration
      responses:
        "200":
          description: Previous configuration activated as a new monotonic version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigurationResponse"
        "409":
          description: No valid previous configuration is available

  /api/v1/configuration/validate:
    post:
      tags: [Configuration]
      operationId: validateConfiguration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValidateConfigurationRequest"
      responses:
        "200":
          description: Validation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationResponse"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/commands:
    post:
      tags: [Commands]
      operationId: createCommand
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommandRequest"
      responses:
        "202":
          description: Command accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandResponse"
        "409":
          $ref: "#/components/responses/ConflictError"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/commands/{commandId}:
    get:
      tags: [Commands]
      operationId: getCommand
      parameters:
        - $ref: "#/components/parameters/CommandId"
      responses:
        "200":
          description: Command status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandResponse"
  /api/v1/schedule-intents:
    get:
      tags: [Schedules]
      summary: Return all persistent schedule intents from ESP32 NVS
      operationId: getScheduleIntents
      responses:
        "200":
          description: List of authoritative persisted schedule intents
          headers:
            Cache-Control:
              schema: { type: string, example: "no-store, no-cache, must-revalidate, max-age=0" }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/EnvelopeBase"
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [revision, total, items]
                        properties:
                          revision: { type: integer }
                          total: { type: integer }
                          items:
                            type: array
                            items:
                              type: object
                              required: [id]
    post:
      tags: [Schedules]
      summary: Save or update schedule intent atomically in ESP32 NVS
      operationId: saveScheduleIntent
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [item]
              properties:
                item:
                  type: object
                  required: [id]
      responses:
        "200":
          description: Schedule intent persisted
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/schedule-intents/{id}:
    put:
      tags: [Schedules]
      summary: Update persistent schedule intent in ESP32 NVS
      operationId: updateScheduleIntent
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [item]
      responses:
        "200":
          description: Schedule intent updated
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags: [Schedules]
      summary: Delete persistent schedule intent from ESP32 NVS
      operationId: deleteScheduleIntent
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Schedule intent deleted from NVS
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"

  /api/v1/schedules/compiled:
    get:
      tags: [Schedules]
      summary: Return derived compiled FreeRTOS scheduler executable set
      operationId: getCompiledSchedules
      responses:
        "200":
          description: Active compiled schedules in FreeRTOS scheduler
    post:
      tags: [Schedules]
      summary: Deploy compiled FreeRTOS scheduler executable set
      operationId: deployCompiledSchedules
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [schedules]
      responses:
        "200":
          description: Compiled schedules activated in FreeRTOS scheduler
        "401":
          $ref: "#/components/responses/UnauthorizedError"
    delete:
      tags: [Schedules]
      summary: Clear compiled FreeRTOS scheduler executable set
      operationId: clearCompiledSchedules
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Compiled schedules cleared

  /api/v1/commands/emergency-stop:
    post:
      tags: [Commands]
      operationId: emergencyStop
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmergencyStopRequest"
      responses:
        "202":
          description: Emergency stop accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandResponse"
        "409":
          $ref: "#/components/responses/ConflictError"
        "422":
          $ref: "#/components/responses/ValidationError"
        "503":
          description: Device unavailable; no physical state change was confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/greenhouses/{ghId}/crop-cycle:
    get:
      tags: [CropCycle]
      operationId: getCurrentCropCycle
      parameters:
        - $ref: "#/components/parameters/GhId"
      responses:
        "200":
          description: Current crop cycle projection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentCropCycleResponse"

  /api/v1/greenhouses/{ghId}/crop-cycles:
    get:
      tags: [CropCycle]
      operationId: listCropCycles
      parameters:
        - $ref: "#/components/parameters/GhId"
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Crop-cycle history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CropCycleHistoryResponse"
    post:
      tags: [CropCycle]
      operationId: startCropCycle
      parameters:
        - $ref: "#/components/parameters/GhId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartCropCycleRequest"
      responses:
        "201":
          description: Cycle created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentCropCycleResponse"
        "409":
          $ref: "#/components/responses/ConflictError"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/greenhouses/{ghId}/crop-cycles/import-active:
    post:
      tags: [CropCycle]
      operationId: importActiveCropCycle
      parameters:
        - $ref: "#/components/parameters/GhId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportActiveCropCycleRequest"
      responses:
        "201":
          description: Active cycle imported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentCropCycleResponse"
        "409":
          $ref: "#/components/responses/ConflictError"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/greenhouses/{ghId}/crop-cycles/{cycleId}/pollination:
    post:
      tags: [CropCycle]
      operationId: recordPollination
      parameters:
        - $ref: "#/components/parameters/GhId"
        - $ref: "#/components/parameters/CycleId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PollinationRequest"
      responses:
        "200":
          description: Pollination recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentCropCycleResponse"
        "409":
          $ref: "#/components/responses/ConflictError"
        "422":
          $ref: "#/components/responses/ValidationError"
    patch:
      tags: [CropCycle]
      operationId: updatePollination
      parameters:
        - $ref: "#/components/parameters/GhId"
        - $ref: "#/components/parameters/CycleId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePollinationRequest"
      responses:
        "200":
          description: Pollination updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentCropCycleResponse"
        "409":
          $ref: "#/components/responses/ConflictError"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags: [CropCycle]
      operationId: deletePollination
      parameters:
        - $ref: "#/components/parameters/GhId"
        - $ref: "#/components/parameters/CycleId"
        - $ref: "#/components/parameters/RequestIdQuery"
      responses:
        "200":
          description: Pollination removed; history preserved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentCropCycleResponse"
        "409":
          $ref: "#/components/responses/ConflictError"

  /api/v1/greenhouses/{ghId}/crop-cycles/{cycleId}/planting-date:
    patch:
      tags: [CropCycle]
      operationId: updatePlantingDate
      parameters:
        - $ref: "#/components/parameters/GhId"
        - $ref: "#/components/parameters/CycleId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePlantingDateRequest"
      responses:
        "200":
          description: Planting date updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentCropCycleResponse"
        "409":
          $ref: "#/components/responses/ConflictError"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/greenhouses/{ghId}/crop-cycles/{cycleId}:
    patch:
      tags: [CropCycle]
      operationId: updateCropCycleMetadata
      parameters:
        - $ref: "#/components/parameters/GhId"
        - $ref: "#/components/parameters/CycleId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCropCycleMetadataRequest"
      responses:
        "200":
          description: Cycle metadata updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentCropCycleResponse"
        "409":
          $ref: "#/components/responses/ConflictError"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/greenhouses/{ghId}/crop-cycles/{cycleId}/cancel:
    post:
      tags: [CropCycle]
      operationId: cancelCropCycle
      parameters:
        - $ref: "#/components/parameters/GhId"
        - $ref: "#/components/parameters/CycleId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OperationRequest"
      responses:
        "200":
          description: Cycle cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentCropCycleResponse"
        "409":
          $ref: "#/components/responses/ConflictError"

  /api/v1/greenhouses/{ghId}/crop-cycles/{cycleId}/harvest:
    post:
      tags: [CropCycle]
      operationId: harvestCropCycle
      parameters:
        - $ref: "#/components/parameters/GhId"
        - $ref: "#/components/parameters/CycleId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HarvestCycleRequest"
      responses:
        "200":
          description: Harvest recorded and active cycle closed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentCropCycleResponse"
        "409":
          $ref: "#/components/responses/ConflictError"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/telemetry:
    get:
      tags: [Telemetry]
      operationId: getTelemetry
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: afterSequence
          in: query
          schema: { type: integer, minimum: 0 }
      responses:
        "200":
          description: Telemetry samples
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelemetryResponse"

  /api/v1/telemetry/current:
    get:
      tags: [Telemetry]
      operationId: getCurrentTelemetry
      summary: Pure RAM fast-path telemetry snapshot
      parameters:
        - name: greenhouseId
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Pure RAM telemetry snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelemetryResponse"

  /api/v1/telemetry/history:
    get:
      tags: [Telemetry]
      operationId: getTelemetryHistory
      summary: Bounded cursor-based persistent telemetry history
      parameters:
        - name: greenhouseId
          in: query
          required: false
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: afterSequence
          in: query
          schema: { type: integer, minimum: 0 }
      responses:
        "200":
          description: Bounded history query
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelemetryResponse"

  /api/v1/telemetry/stream:
    get:
      tags: [Telemetry]
      operationId: streamTelemetryWs
      summary: Persistent WebSocket telemetry stream (10s idle, 3s active pump cadence)
      responses:
        "101":
          description: WebSocket Upgrade successful

  /api/v1/events:
    get:
      tags: [Events]
      operationId: getEvents
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: afterSequence
          in: query
          schema: { type: integer, minimum: 0 }
      responses:
        "200":
          description: Events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventResponse"

  /api/v1/calibration:
    post:
      tags: [Calibration]
      operationId: startCalibration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalibrationRequest"
      responses:
        "200":
          description: Calibration started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeBase"
        "400":
          $ref: "#/components/responses/ValidationError"
        "409":
          $ref: "#/components/responses/ConflictError"

  /api/v1/calibration/status:
    get:
      tags: [Calibration]
      operationId: getCalibrationStatus
      responses:
        "200":
          description: Current calibration status
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/EnvelopeBase"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          status: { $ref: "#/components/schemas/CalibrationStatus" }

  /api/v1/calibration/rate:
    get:
      tags: [Calibration]
      operationId: getCalibrationRate
      responses:
        "200":
          description: Persistent dosing calibration rates
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/EnvelopeBase"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          rates: { $ref: "#/components/schemas/CalibrationRates" }
    post:
      tags: [Calibration]
      operationId: setCalibrationRate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetCalibrationRateRequest"
      responses:
        "200":
          description: Calibration rate saved to NVS
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeBase"
        "400":
          $ref: "#/components/responses/ValidationError"

  /api/v1/calibration/record:
    get:
      tags: [Calibration]
      operationId: getCalibrationRecord
      parameters:
        - { name: componentId, in: query, required: true, schema: { type: string } }
        - { name: calibrationType, in: query, required: true, schema: { type: string, enum: [DOSING_RATE, FLOW, LEVEL, PH, EC] } }
        - { name: calibrationId, in: query, required: true, schema: { type: string } }
        - { name: version, in: query, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Exact persisted calibration record
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/EnvelopeBase"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/CalibrationRecord"
        "404":
          $ref: "#/components/responses/NotFoundError"
    post:
      tags: [Calibration]
      operationId: saveCalibrationRecord
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalibrationRecordRequest"
      responses:
        "200":
          description: Calibration record persisted and returned by exact ID/version
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/EnvelopeBase"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/CalibrationRecord"
        "400":
          $ref: "#/components/responses/ValidationError"
        "409":
          $ref: "#/components/responses/ConflictError"

  /api/v1/topology-capabilities:
    get:
      tags: [Device]
      operationId: getTopologyCapabilities
      responses:
        "200":
          description: Topology and capability state derived from the active configuration
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/EnvelopeBase"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/TopologyCapabilitiesResponse"
        "503":
          description: Active topology unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /api/v1/schedules/compiled:
    get:
      tags: [Schedule]
      operationId: getCompiledSchedules
      responses:
        "200":
          description: Currently deployed compiled schedule set
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/EnvelopeBase"
                  - type: object
                    required: [data]
                    properties:
                      data:
                        $ref: "#/components/schemas/CompiledScheduleDeployment"
    post:
      tags: [Schedule]
      operationId: deployCompiledSchedules
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompiledScheduleDeploymentRequest"
      responses:
        "200":
          description: Compiled schedule set accepted and persisted for the active configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeBase"
        "409":
          $ref: "#/components/responses/ConflictError"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags: [Schedule]
      operationId: clearCompiledSchedules
      responses:
        "200":
          description: Compiled schedule set cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeBase"

  /api/v1/schedule-intents:
    get:
      tags: [Schedule]
      summary: List persistent schedule intents
      description: Returns all authoritative schedule intents persisted in NVS
      operationId: getScheduleIntents
      responses:
        "200":
          description: List of authoritative schedule intents
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/EnvelopeBase"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items:
                              type: object
                          total: { type: integer }
                          revision: { type: integer }
    post:
      tags: [Schedule]
      summary: Create or update schedule intent
      description: Persists an authoritative user schedule intent in NVS
      operationId: saveScheduleIntent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Schedule intent saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeBase"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/schedule-intents/{id}:
    put:
      tags: [Schedule]
      summary: Update schedule intent
      description: Updates an authoritative user schedule intent by ID in NVS
      operationId: updateScheduleIntent
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Schedule intent updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeBase"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags: [Schedule]
      summary: Delete schedule intent
      description: Removes an authoritative user schedule intent by ID from NVS
      operationId: deleteScheduleIntent
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Schedule intent removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeBase"
        "404":
          $ref: "#/components/responses/NotFoundError"

  /api/v1/schedules:
    get:
      tags: [Schedule]
      operationId: getSchedules
      responses:
        "200":
          description: List of configured schedules from NVS
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/EnvelopeBase"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          items:
                            type: array
                            items:
                              $ref: "#/components/schemas/ScheduleItem"
                          total: { type: integer }
    post:
      deprecated: true
      tags: [Schedule]
      operationId: saveScheduleLegacy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleItem"
      responses:
        "410":
          description: Raw schedule persistence has been retired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/schedules/{id}:
    delete:
      tags: [Schedule]
      operationId: deleteSchedule
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Schedule removed from NVS
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeBase"
  /api/v1/fertigation/start:
    post:
      tags: [Fertigation]
      summary: Start fertigation run
      description: Starts a fertigation run with resolved execution plan on ESP32
      operationId: startFertigation
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                commandId: { type: string }
                ghId: { type: string }
                recipeId: { type: string }
                executionPlan: { type: object }
      responses:
        "202":
          description: Fertigation batch accepted and started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeBase"
        "409":
          $ref: "#/components/responses/ConflictError"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/fertigation/status:
    get:
      tags: [Fertigation]
      summary: Get fertigation status
      description: Authoritative live runtime status and phase telemetry of fertigation
      operationId: getFertigationStatus
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Live fertigation runtime snapshot
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/EnvelopeBase"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          state: { type: string }
                          phase: { type: string }
                          runId: { type: string }
                          complexId: { type: string }
                          ghId: { type: string }
                          recipeId: { type: string }
                          targetWaterMl: { type: integer }
                          actualWaterMl: { type: integer }
                          deliveryMode: { type: string }
                          deliveryTargetMl: { type: integer }
                          actualDeliveredMl: { type: integer }
                          actualFlowLpm: { type: number }
                          targetFlowLpm: { type: number }
                          mixing:
                            type: object
                            properties:
                              status: { type: string }
                          delivery:
                            type: object
                            properties:
                              status: { type: string }
                          thresholdPercent: { type: integer }
                          queuedBatches:
                            type: array
                            items:
                              type: object
                              properties:
                                queueId: { type: string }
                                occurrenceId: { type: string }
                                scheduleId: { type: string }
                                ghId: { type: string }
                                batchId: { type: string }
                                status: { type: string }
                          todaySchedule:
                            type: array
                            items:
                              type: object
                              properties:
                                occurrenceId: { type: string }
                                scheduleId: { type: string }
                                complexId: { type: string }
                                ghId: { type: string }
                                scheduledTimestamp: { type: number }
                                status: { type: string }
                                queueId: { type: string }
                                batchId: { type: string }
                          activeDeliveries:
                            type: array
                            items:
                              type: object
                              properties:
                                ghId: { type: string }
                                occurrenceId: { type: string }
                                batchId: { type: string }
                                status: { type: string }
                                deliveryPumpId: { type: string }

  /api/v1/fertigation/queue:
    get:
      tags: [Fertigation]
      summary: Get fertigation queue and operational schedule
      description: Authoritative live state of Global Dosing Queue and Today's Operational Schedule
      operationId: getFertigationQueue
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Live queue snapshot
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/EnvelopeBase"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          activeBatch: { type: object }
                          queuedBatches:
                            type: array
                            items:
                              type: object
                          todaySchedule:
                            type: array
                            items:
                              type: object
                          activeDeliveries:
                            type: array
                            items:
                              type: object

  /api/v1/fertigation/stop:
    post:
      tags: [Fertigation]
      summary: Stop fertigation run
      description: Aborts any active fertigation batch and returns actuators to safe idle
      operationId: stopFertigation
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Fertigation run aborted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeBase"
        "409":
          $ref: "#/components/responses/ConflictError"

  /api/v1/recipes:
    get:
      tags: [Recipe]
      summary: List all recipes
      description: Returns all recipes persistently stored on the ESP32 MicroSD card.
      operationId: getRecipes
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of stored recipes
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/EnvelopeBase"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          total: { type: integer }
                          storageStatus: { type: string, enum: [PERSISTED, STORAGE_UNAVAILABLE] }
                          recipes:
                            type: array
                            items:
                              $ref: "#/components/schemas/Recipe"
    post:
      tags: [Recipe]
      summary: Create or update recipe
      description: Persists a fertigation recipe directly to the ESP32 MicroSD card under /sdcard/recipes/<id>.json
      operationId: createRecipe
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Recipe"
      responses:
        "201":
          description: Recipe persisted to MicroSD card
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/EnvelopeBase"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Recipe"
        "503":
          description: MicroSD storage unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/recipes/{id}:
    get:
      tags: [Recipe]
      summary: Get recipe by ID
      description: Retrieves a single recipe from the ESP32 MicroSD card.
      operationId: getRecipeById
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Recipe details
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/EnvelopeBase"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Recipe"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "503":
          description: MicroSD storage unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      tags: [Recipe]
      summary: Update recipe by ID
      description: Updates an existing recipe on the ESP32 MicroSD card.
      operationId: updateRecipeById
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Recipe"
      responses:
        "200":
          description: Recipe updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/EnvelopeBase"
                  - type: object
                    properties:
                      data:
                        $ref: "#/components/schemas/Recipe"
        "503":
          description: MicroSD storage unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags: [Recipe]
      summary: Delete recipe by ID
      description: Removes a recipe file from the ESP32 MicroSD card.
      operationId: deleteRecipeById
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Recipe deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeBase"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "503":
          description: MicroSD storage unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /setup:
    get:
      tags: [LocalSetup]
      operationId: getLocalSetupPage
      description: Minimal embedded HTML setup page available only during factory provisioning or temporary Direct Local Mode.
      responses:
        "200":
          description: Local setup HTML page
          content:
            text/html:
              schema:
                type: string
        "404":
          description: Local setup mode is not active

  /setup/api/status:
    get:
      tags: [LocalSetup]
      operationId: getLocalSetupStatus
      description: Controller-local status for factory setup, Wi-Fi change and Direct Local Mode. This surface must not expose actuator execution.
      responses:
        "200":
          description: Local setup state
          content:
            application/json:
              schema:
                type: object
                properties:
                  mode: { type: string }
                  deviceId: { type: string }
                  complexId: { type: string, nullable: true }
                  connected: { type: boolean }
                  currentSsid: { type: string }
                  ip: { type: string }
                  mac: { type: string }
                  setupSsid: { type: string }
                  setupCode: { type: string }
                  candidateState: { type: string, enum: [IDLE, CONNECTING, SUCCESS, FAILED] }
                  candidateSsid: { type: string }
                  candidateError: { type: string }
                  networkChange: { type: boolean }
                  directLocal: { type: boolean }
                  apClientCount: { type: integer, minimum: 0 }
                  apTimeoutSec: { type: integer, minimum: 0 }
        "404":
          description: Local setup mode is not active

  /setup/api/scan:
    get:
      tags: [LocalSetup]
      operationId: scanLocalWifi
      description: Scan nearby Wi-Fi networks from the controller-local setup path.
      responses:
        "200":
          description: Nearby Wi-Fi networks
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [ssid, rssi]
                  properties:
                    ssid: { type: string }
                    rssi: { type: integer }
        "404":
          description: Local setup mode is not active
        "503":
          description: Wi-Fi scan failed

  /setup/api/connect:
    post:
      tags: [LocalSetup]
      operationId: submitLocalWifiCandidate
      description: Test a candidate router credential at runtime. Persisted Wi-Fi credentials are replaced only after the controller obtains an IP and commits the candidate atomically.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ssid, password]
              properties:
                ssid: { type: string, minLength: 1, maxLength: 32 }
                password: { type: string, maxLength: 64 }
      responses:
        "202":
          description: Candidate connection test started
          content:
            application/json:
              schema:
                type: object
                required: [state, ssid]
                properties:
                  state: { type: string, enum: [CONNECTING] }
                  ssid: { type: string }
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          description: Local setup mode is not active
        "409":
          description: Local network change transaction is unavailable
        "503":
          description: Candidate Wi-Fi validation could not be started

  /setup/api/finish:
    post:
      tags: [LocalSetup]
      operationId: finishLocalSetup
      description: Exit Direct Local / Network Change setup after the candidate transaction is complete. This never resets the controller.
      responses:
        "200":
          description: Local setup mode closed
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success: { type: boolean, enum: [true] }
        "409":
          description: Setup mode is not active or candidate transaction is not ready

  /api/v1/export/capabilities:
    get:
      tags: [Export]
      operationId: getExportCapabilities
      summary: Query dataset export capabilities and storage state
      description: Returns dataset types, formats, chunking limits, and SD card mount/degraded status for future backend synchronization.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Export capabilities snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportCapabilitiesResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /api/v1/export/jobs:
    post:
      tags: [Export]
      operationId: createExportJob
      summary: Create historical export job
      description: Requests ESP32 to prepare historical dataset from SD for export. Returns 503 if SD is absent or degraded.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateExportJobRequest"
      responses:
        "201":
          description: Export job created and ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateExportJobResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "503":
          description: MicroSD storage absent or unmounted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/export/jobs/{exportId}:
    get:
      tags: [Export]
      operationId: getExportJobStatus
      summary: Check export job status
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ExportId"
      responses:
        "200":
          description: Job status and progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportJobStatusResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"

  /api/v1/export/jobs/{exportId}/manifest:
    get:
      tags: [Export]
      operationId: getExportJobManifest
      summary: Get export job manifest and checksum
      description: Returns manifest with CRC32 checksum, byte count, record count, and file set before backend acknowledgement.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ExportId"
      responses:
        "200":
          description: Export job manifest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportManifestResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"

  /api/v1/export/jobs/{exportId}/data:
    get:
      tags: [Export]
      operationId: getExportJobChunk
      summary: Retrieve chunked export data stream
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ExportId"
        - name: chunkIndex
          in: query
          required: false
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: Export chunk data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportChunkResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"

  /api/v1/export/jobs/{exportId}/ack:
    post:
      tags: [Export]
      operationId: acknowledgeExportJob
      summary: Acknowledge export and trigger safe deletion
      description: Explicit idempotent acknowledgement by backend. Only after ACK are exported historical files purged from SD. Active cycles are never deleted.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ExportId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExportAckRequest"
      responses:
        "200":
          description: Acknowledgement processed and scoped records purged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportAckResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "422":
          $ref: "#/components/responses/ValidationError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    GhId:
      name: ghId
      in: path
      required: true
      schema: { type: string }
    CycleId:
      name: cycleId
      in: path
      required: true
      schema: { type: string }
    CommandId:
      name: commandId
      in: path
      required: true
      schema: { type: string }
    RequestIdQuery:
      name: requestId
      in: query
      required: false
      schema: { type: string }
    ExportId:
      name: exportId
      in: path
      required: true
      schema: { type: string }

  responses:
    ValidationError:
      description: Semantic validation error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ConflictError:
      description: State/version conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFoundError:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    EnvelopeBase:
      type: object
      required: [requestId, success, deviceTimestamp]
      properties:
        requestId: { type: string }
        success: { type: boolean }
        deviceTimestamp: { type: string, format: date-time }

    SystemTopologyPoolResponse:
      allOf:
        - $ref: "#/components/schemas/EnvelopeBase"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/SystemTopologyPool"

    SystemTopologyPool:
      type: object
      required: [schemaId, schemaVersion, contractHash, poolRevision, poolHash, originDeviceId, devices, complexes, tombstones]
      properties:
        schemaId: { type: string, example: "agrotech.system-topology-pool" }
        schemaVersion: { type: integer, example: 1 }
        contractHash: { type: string }
        poolRevision: { type: integer, minimum: 1 }
        poolHash: { type: string }
        originDeviceId: { type: string }
        generatedAt: { type: string, format: date-time }
        devices:
          type: array
          items:
            $ref: "#/components/schemas/TopologyDeviceRecord"
        complexes:
          type: array
          items:
            $ref: "#/components/schemas/TopologyComplexRecord"
        greenhouses:
          type: array
          items:
            $ref: "#/components/schemas/TopologyGreenhouseRecord"
        tombstones:
          type: array
          items:
            $ref: "#/components/schemas/TopologyTombstone"

    TopologyPoolMetaResponse:
      allOf:
        - $ref: "#/components/schemas/EnvelopeBase"
        - type: object
          properties:
            data:
              type: object
              required: [schemaId, schemaVersion, contractHash, poolRevision, poolHash, deviceId]
              properties:
                schemaId: { type: string }
                schemaVersion: { type: integer }
