      required: [targetHarvestHst, points]
      properties:
        targetHarvestHst: { type: integer, minimum: 1 }
        points:
          type: array
          items:
            type: object
            required: [id, name, startHst, endHst]
            properties:
              id: { type: string }
              name: { type: string }
              startHst: { oneOf: [{ type: integer }, { type: string }] }
              endHst: { oneOf: [{ type: integer }, { type: string }] }
              note: { type: string, nullable: true }
        maintenance:
          type: array
          items:
            type: object
            required: [id, name, hst]
            properties:
              id: { type: string }
              name: { type: string }
              hst: { oneOf: [{ type: integer }, { type: string }] }
              category: { type: string, nullable: true }
              note: { type: string, nullable: true }

    OperationRequest:
      allOf:
        - $ref: "#/components/schemas/BaseCropCycleRequest"
        - type: object
          properties:
            payload:
              type: object
              required: [expectedVersion]
              properties:
                expectedVersion: { type: integer }

    HarvestCycleRequest:
      allOf:
        - $ref: "#/components/schemas/BaseCropCycleRequest"
        - type: object
          properties:
            payload:
              type: object
              required: [expectedVersion]
              properties:
                harvestDate: { type: string, format: date, nullable: true }
                yieldKg: { type: number, minimum: 0, nullable: true }
                grade: { type: string, nullable: true }
                notes: { type: string, nullable: true }
                expectedVersion: { type: integer }

    Capability:
      type: object
      required: [capabilityId, type]
      properties:
        capabilityId: { type: string }
        type: { type: string }
        value: { type: string, nullable: true }

    Resource:
      type: object
      required: [resourceId, type, componentId]
      properties:
        resourceId: { type: string }
        type: { type: string }
        componentId: { type: string }
        capabilities:
          type: array
          items:
            $ref: "#/components/schemas/Capability"

    Assignment:
      type: object
      required: [assignmentId, resourceId, scope]
      properties:
        assignmentId: { type: string }
        resourceId: { type: string }
        scope: { type: string, enum: [COMPLEX, GREENHOUSE] }
        ghId: { type: string, nullable: true }

    Ownership:
      type: object
      required: [resourceId, ownerId, ownerType]
      properties:
        resourceId: { type: string }
        ownerId: { type: string }
        ownerType: { type: string, enum: [SCHEDULE, MANUAL, SYSTEM] }

    Topology:
      type: object
      required: [sourceResourceId, targetResourceId, connectionType]
      properties:
        sourceResourceId: { type: string }
        targetResourceId: { type: string }
        connectionType: { type: string }

    ComponentAssignment:
      type: object
      required: [complexId]
      properties:
        complexId: { type: string }
        ghId: { type: string, nullable: true }

    ComponentWiring:
      type: object
      required: [interface]
      properties:
        interface: { type: string, enum: [GPIO, I2C, UART, SPI, ONE_WIRE, ANALOG, VIRTUAL] }
        gpio: { type: integer, nullable: true }
        channel: { type: integer, nullable: true }
        address: { type: string, nullable: true }
        port: { type: string, nullable: true }
        polarity: { type: string, enum: [ACTIVE_HIGH, ACTIVE_LOW], nullable: true }

    ComponentCommissioning:
      type: object
      properties:
        commissionedAt: { type: string, format: date-time, nullable: true }
        commissionedBy: { type: string, nullable: true }
        result: { type: string, enum: [PASS, FAIL], nullable: true }
        notes: { type: string, nullable: true }

    Component:
      type: object
      required: [componentId, supportedTypeId, name, lifecycleState, deploymentStatus, parameters]
      properties:
        componentId: { type: string }
        supportedTypeId: { type: string }
        name: { type: string }
        lifecycleState: 
          type: string
          enum: [REGISTERED, NOT_COMMISSIONED, COMMISSIONED, ENABLED, DISABLED, FAULTED, REMOVED]
        deploymentStatus:
          type: string
          enum: [PENDING, APPLIED, FAILED, UNKNOWN]
        assignment: { $ref: "#/components/schemas/ComponentAssignment", nullable: true }
        wiring: { $ref: "#/components/schemas/ComponentWiring", nullable: true }
        parameters: 
          type: object
          additionalProperties: true
        commissioning: { $ref: "#/components/schemas/ComponentCommissioning", nullable: true }
        role: { type: string, nullable: true }
        resourceId: { type: string, nullable: true }

    TelemetrySnapshot:
      type: object
      required: [complexId, timestamp, samples]
      properties:
        complexId: { type: string }
        ghId: { type: string, nullable: true }
        timestamp: { type: string, format: date-time }
        samples:
          type: array
          items:
            type: object
            required: [sequence, deviceTimestamp, componentId, value, unit, quality, measurementType]
            properties:
              sequence: { type: integer }
              deviceTimestamp: { type: string, format: date-time }
              componentId: { type: string }
              value: { type: number, nullable: true }
              unit: { type: string }
              quality: { type: string, enum: [GOOD, UNCERTAIN, BAD] }
              measurementType: { type: string, enum: [MEASURED, DERIVED, UNAVAILABLE, INVALID] }

    TelemetryResponse:
      allOf:
        - $ref: "#/components/schemas/EnvelopeBase"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/TelemetrySnapshot"

    Event:
      type: object
      required: [eventId, sequence, deviceTimestamp, eventType, severity]
      properties:
        eventId: { type: string }
        sequence: { type: integer }
        deviceTimestamp: { type: string, format: date-time }
        eventType: { type: string }
        severity: { type: string, enum: [INFO, WARNING, FAULT, CRITICAL] }
        complexId: { type: string, nullable: true }
        ghId: { type: string, nullable: true }
        componentId: { type: string, nullable: true }
        payload: { type: object, additionalProperties: true }

    EventResponse:
      allOf:
        - $ref: "#/components/schemas/EnvelopeBase"
        - type: object
          properties:
            data:
              type: object
              properties:
                events:
                  type: array
                  items:
                    $ref: "#/components/schemas/Event"
                nextSequence: { type: integer, nullable: true }
                hasMore: { type: boolean }

    FertigationRun:
      type: object
      required: [runId, recipeId, ghId, status]
      properties:
        runId: { type: string }
        recipeId: { type: string }
        ghId: { type: string }
        status: { type: string, enum: [PENDING, MIXING, DOSING, DELIVERY, COMPLETED, CANCELLED, FAULTED] }
        targetWaterL: { type: number, nullable: true }
        actualWaterL: { type: number, nullable: true }
        targetDosingAMl: { type: number, nullable: true }
        actualDosingAMl: { type: number, nullable: true }
        targetDosingBMl: { type: number, nullable: true }
        actualDosingBMl: { type: number, nullable: true }
        startTimestamp: { type: string, format: date-time, nullable: true }
        endTimestamp: { type: string, format: date-time, nullable: true }
        progressPct: { type: integer, minimum: 0, maximum: 100, nullable: true }

    CalibrationRecordRequest:
      type: object
      required: [componentId, calibrationType, calibrationId, version, state, operator]
      properties:
        componentId: { type: string }
        calibrationType: { type: string, enum: [DOSING_RATE, FLOW, LEVEL, PH, EC] }
        calibrationId: { type: string }
        version: { type: integer, minimum: 1 }
        state: { type: string, enum: [NOT_CALIBRATED, CALIBRATED, VERIFIED, EXPIRED, SUSPECT, RECALIBRATED, REMOVED] }
        operator: { type: string }
        validUntilMs: { type: integer, nullable: true }
        rateMlPerSec: { type: number, minimum: 0.000001, nullable: true }
        slope: { type: number, nullable: true }
        offset: { type: number, nullable: true }
        pulsesPerLiter: { type: number, minimum: 0.000001, nullable: true }

    CalibrationRecord:
      type: object
      required: [calibrationId, componentId, calibrationType, version, state, createdAtMs, validFromMs, operator]
      properties:
        calibrationId: { type: string }
        componentId: { type: string }
        calibrationType: { type: string, enum: [DOSING_RATE, FLOW, LEVEL, PH, EC] }
        version: { type: integer, minimum: 1 }
        state: { type: string, enum: [NOT_CALIBRATED, CALIBRATED, VERIFIED, EXPIRED, SUSPECT, RECALIBRATED, REMOVED] }
        createdAtMs: { type: integer }
        validFromMs: { type: integer }
        validUntilMs: { type: integer, nullable: true }
        operator: { type: string }
        parameters: { type: object, additionalProperties: true }

    CalibrationRequest:
      type: object
      required: [componentId, type, durationSec]
      properties:
        componentId: { type: string }
        type: { type: string, enum: [DOSING_A, DOSING_B, FLOW_RAW, FLOW_FERT, SENSOR_PH, SENSOR_EC] }
        durationSec: { type: integer, minimum: 1 }

    CalibrationStatus:
      type: object
      required: [state, remainingSec]
      properties:
        state: { type: string, enum: [IDLE, RUNNING, COMPLETE, ERROR] }
        remainingSec: { type: integer, minimum: 0 }
        measuredValue: { type: number, nullable: true }

    CalibrationRates:
      type: object
      required: [rateDosingAMlSec, rateDosingBMlSec, flowRawPulsesPerL, flowFertPulsesPerL]
      properties:
        rateDosingAMlSec: { type: number, minimum: 0 }
        rateDosingBMlSec: { type: number, minimum: 0 }
        flowRawPulsesPerL: { type: number, minimum: 0 }
        flowFertPulsesPerL: { type: number, minimum: 0 }

    SetCalibrationRateRequest:
      type: object
      required: [componentId, rateValue]
      properties:
        componentId: { type: string }
        rateValue: { type: number, minimum: 0.001 }

    Plant:
      type: object
      required: [plantId, cycleId, ghId, plantTag, status, plantedAt]
      properties:
        plantId: { type: string }
        cycleId: { type: string }
        ghId: { type: string }
        plantTag: { type: string }
        status: { type: string, enum: [HEALTHY, SICK, DEAD, HARVESTED] }
        plantedAt: { type: string, format: date-time }
        mortalityDate: { type: string, format: date-time, nullable: true }
        mortalityReason: { type: string, nullable: true }

    Fruit:
      type: object
      required: [fruitId, plantId, cycleId, status, taggedAt]
      properties:
        fruitId: { type: string }
        plantId: { type: string }
        cycleId: { type: string }
        status: { type: string, enum: [DEVELOPING, HARVESTED, DROPPED, CULLED] }
        taggedAt: { type: string, format: date-time }
        harvestedAt: { type: string, format: date-time, nullable: true }
        weightG: { type: number, nullable: true }
        qualityGrade: { type: string, nullable: true }

    Observation:
      type: object
      required: [observationId, plantId, cycleId, timestamp, heightCm, leafCount, fruitCount]
      properties:
        observationId: { type: string }
        plantId: { type: string }
        cycleId: { type: string }
        timestamp: { type: string, format: date-time }
        heightCm: { type: number }
        leafCount: { type: integer }
        fruitCount: { type: integer }
        notes: { type: string, nullable: true }

    ErrorResponse:
      allOf:
        - $ref: "#/components/schemas/EnvelopeBase"
        - type: object
          required: [error]
          properties:
            error:
              type: object
              required: [code, message, retryable, reconcileRequired]
              properties:
                code: { type: string }
                message: { type: string }
                retryable: { type: boolean }
                reconcileRequired: { type: boolean }
                details: { type: object, additionalProperties: true }

    Recipe:
      type: object
      required: [recipeId, name]
      properties:
        recipeId: { type: string }
        id: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        targetWaterL: { type: number, nullable: true }
        waterL: { type: number, nullable: true }
        dosingAml: { type: number, nullable: true }
        dosingBml: { type: number, nullable: true }
        dosingChannels:
          type: array
          items:
            type: object
            required: [componentId, requestedMl]
            properties:
              componentId: { type: string }
              requestedMl: { type: number }
              calibrationId: { type: string, nullable: true }
              calibrationVersion: { type: integer, nullable: true }
        targetPpm: { type: number, nullable: true }
        targetEc: { type: string, nullable: true }
        version: { type: integer, default: 1 }
        storageStatus: { type: string, enum: [PERSISTED, STORAGE_UNAVAILABLE], nullable: true }
        createdAt: { type: string, format: date-time, nullable: true }
        updatedAt: { type: string, format: date-time, nullable: true }

    ExportCapabilitiesResponse:
      allOf:
        - $ref: "#/components/schemas/EnvelopeBase"
        - type: object
          properties:
            data:
              type: object
              required: [version, storage, supportedDatasets]
              properties:
                version: { type: string }
                storage:
                  type: object
                  required: [sdMounted, degraded, storageMedium]
                  properties:
                    sdMounted: { type: boolean }
                    degraded: { type: boolean }
                    storageMedium: { type: string, enum: [SDCARD, NONE] }
                supportedDatasets:
                  type: object
                  additionalProperties:
                    type: object
                    required: [format, version, chunking, deleteAfterAck, maxChunkBytes, description]
                    properties:
                      format: { type: string }
                      version: { type: string }
                      chunking: { type: boolean }
                      deleteAfterAck: { type: boolean }
                      maxChunkBytes: { type: integer }
                      description: { type: string }

    CreateExportJobRequest:
      type: object
      required: [dataset]
      properties:
        requestId: { type: string }
        payload:
          type: object
          required: [dataset]
          properties:
            dataset: { type: string, enum: [crop_cycles, plants, telemetry, events, fertigation_runs, system_logs] }
            complexId: { type: string }
            ghId: { type: string }
            from: { type: string }
            to: { type: string }
            limit: { type: integer }

    CreateExportJobResponse:
      allOf:
        - $ref: "#/components/schemas/EnvelopeBase"
        - type: object
          properties:
            data:
              type: object
              required: [exportId, dataset, state, recordCount, totalBytes, totalChunks, chunkBytes]
              properties:
                exportId: { type: string }
                dataset: { type: string }
                state: { type: string, enum: [PENDING, READY, STREAMING, ACKNOWLEDGED, COMPLETED, DELETED, FAILED] }
                recordCount: { type: integer }
                totalBytes: { type: integer }
                totalChunks: { type: integer }
                chunkBytes: { type: integer }

    ExportJobStatusResponse:
      allOf:
        - $ref: "#/components/schemas/EnvelopeBase"
        - type: object
          properties:
            data:
              type: object
              required: [exportId, dataset, state, recordCount, totalBytes, totalChunks]
              properties:
                exportId: { type: string }
                dataset: { type: string }
                state: { type: string }
                recordCount: { type: integer }
                totalBytes: { type: integer }
                totalChunks: { type: integer }
                chunkBytes: { type: integer }
                crc32: { type: integer }
                deletionEligible: { type: boolean }

    ExportManifestResponse:
      allOf:
        - $ref: "#/components/schemas/EnvelopeBase"
        - type: object
          properties:
            data:
              type: object
              required: [exportId, dataset, recordCount, totalBytes, checksumCrc32, schemaVersion, isComplete]
              properties:
                exportId: { type: string }
                dataset: { type: string }
                recordCount: { type: integer }
                totalBytes: { type: integer }
                checksumCrc32: { type: integer }
                schemaVersion: { type: string }
                isComplete: { type: boolean }
                fileCount: { type: integer }
                files:
                  type: array
                  items: { type: string }

    ExportChunkResponse:
      allOf:
        - $ref: "#/components/schemas/EnvelopeBase"
        - type: object
          properties:
            data:
              type: object
              required: [exportId, dataset, chunkIndex, offsetBytes, chunkBytes, totalBytes, isLastChunk, records]
              properties:
                exportId: { type: string }
                dataset: { type: string }
                chunkIndex: { type: integer }
                offsetBytes: { type: integer }
                chunkBytes: { type: integer }
                totalBytes: { type: integer }
                isLastChunk: { type: boolean }
                records:
                  type: array
                  items: { type: object }

    ExportAckRequest:
      type: object
      properties:
        requestId: { type: string }
        payload:
          type: object
          properties:
            clientChecksum: { type: integer }
            deleteExported: { type: boolean, default: true }

    ExportAckResponse:
      allOf:
        - $ref: "#/components/schemas/EnvelopeBase"
        - type: object
          properties:
            data:
              type: object
              required: [exportId, acknowledged, deleted, filesRemoved, state]
              properties:
                exportId: { type: string }
                acknowledged: { type: boolean }
                deleted: { type: boolean }
                filesRemoved: { type: integer }
                state: { type: string }

